[advd12_common]
build_flags     = -IMarlin/src/advd12/libs/lvgl-release-v8.4

[env:advd12_230_mks_12]
extends         = env:mks_robin_nano_v1v2
build_flags     = ${env:mks_robin_nano_v1v2.build_flags} ${advd12_common.build_flags} -DD12_230_v1_2
build_unflags   = ${env:mks_robin_nano_v1v2.build_unflags}
monitor_port    = /dev/cu.usbserial-23340
monitor_speed   = 115200

[env:advd12_230_bl_mks_12]
extends         = env:mks_robin_nano_v1v2
build_flags     = ${env:mks_robin_nano_v1v2.build_flags} ${advd12_common.build_flags} -DD12_230_v1_2 -DBLTOUCH
build_unflags   = ${env:mks_robin_nano_v1v2.build_unflags}
monitor_port    = /dev/cu.usbserial-23340
monitor_speed   = 115200

