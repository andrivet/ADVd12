[advd12_common]
build_flags     = -IMarlin/src/advd12/libs/lvgl-release-v8.4

[env:advd12_230]
extends         = mks_robin_nano_v1v2_common
build_flags     = ${mks_robin_nano_v1v2_common.build_flags} ${advd12_common.build_flags} -DENABLE_HWSERIAL3 -DD12_230_v1_2 -DBLTOUCH
build_unflags   = ${mks_robin_nano_v1v2_common.build_unflags} -DUSBCON -DUSBD_USE_CDC
monitor_port    = /dev/cu.usbserial-23340

[env:advd12_simulator]
extends         = env:simulator_linux_debug
build_flags     = ${env:simulator_linux_debug.build_flags} ${simulator_macos.build_flags} ${advd12_common.build_flags} -ggdb -Og -D_THREAD_SAFE -DD12_SIMULATOR
build_unflags   = ${simulator_macos.build_unflags}
