name: ✨ Request a feature
description: Request a new ADVd12 firmware feature
title: "[FR] (feature summary)"
labels: ["T: Feature Request"]
body:
  - type: markdown
    attributes:
      value: >
        **Thank you for requesting a new ADVd12 firmware feature!**

  - type: textarea
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear description of the problem (e.g., "I need X but ADVd12 can't do it [...]").

  - type: textarea
    attributes:
      label: Are you looking for hardware support?
      description: Tell us the printer, board, or peripheral that needs support.

  - type: textarea
    attributes:
      label: Describe the feature you want
      description: A clear description of the feature and how you think it should work.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
